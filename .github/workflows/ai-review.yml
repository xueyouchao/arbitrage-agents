name: AI Code Review (PR-Agent, multi-model)

# Runs qodo-ai/pr-agent on every PR with five independent reviewers:
#   - two OpenRouter free-tier models
#   - three Ollama Cloud models
#
# PR-Agent reads its per-invocation settings from environment variables.
# The action's env block uses PR-Agent's double-underscore dotted-key format:
#   config__model, github_action_config__auto_review, pr_reviewer__...
# Dots are NOT used in env var names because they do not survive into the
# action process reliably.
#
# Ollama Cloud is accessed ONLY through its OpenAI-compatible endpoint
# (https://ollama.com/v1) so LiteLLM sends the Authorization: Bearer header
# automatically. Do NOT set OLLAMA_API_BASE / OLLAMA_API_KEY; those are not
# used by the openai/ provider and would only cause confusion. The model id
# MUST include the :cloud suffix.
#
# All jobs are review-only (auto_describe=false, auto_improve=false). The
# "Failed to generate code suggestions for PR" message comes from the
# /improve command; if you still see it after this change, another PR-Agent
# installation (GitHub App, another workflow, or repo-level config) is running.
#
# Re-review on push: the `on: pull_request` trigger below already includes
# `synchronize` (fires on every commit pushed to a PR branch), but that only
# makes the workflow *run*. PR-Agent's runner additionally gates each auto tool
# on github_action_config.pr_actions, whose default list omits `synchronize`,
# so follow-up pushes were silently skipped. Each job sets pr_actions below to
# include `synchronize`, so reviews re-run on every push.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  # ---- OpenRouter reviewer 1 ----
  review-nex:
    name: Review — nex-agi/nex-n2-pro
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Guard against Claude models on OpenRouter
        run: |
          if [ "${{ contains(env.config__model, 'claude') }}" = "true" ] || \
             [ "${{ contains(env.config__fallback_models, 'claude') }}" = "true" ]; then
            echo "::error::Repo policy forbids Claude models on OpenRouter."
            exit 1
          fi

      - name: PR-Agent /review (OpenRouter)
        uses: the-pr-agent/pr-agent@v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          github_action_config__auto_review: "true"
          github_action_config__auto_describe: "false"
          github_action_config__auto_improve: "false"

          # Re-run review on every commit pushed to the PR (synchronize),
          # not just on open/reopen/ready_for_review. Without this, PR-Agent's
          # runner skips the auto tools on follow-up pushes because its
          # default pr_actions list omits "synchronize".
          github_action_config__pr_actions: '["opened", "synchronize", "reopened", "ready_for_review", "review_requested"]'

          config__model: "openrouter/nex-agi/nex-n2-pro:free"
          config__fallback_models: '["openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"]'
          config__custom_model_max_tokens: "8000"

          pr_reviewer__require_focused_review: "true"
          pr_reviewer__num_required_app_review_comments: "1"
          pr_reviewer__exclude_globs: '["**/*.md","**/docs/**","**/coverage/**","**/dist/**"]'

          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # ---- OpenRouter reviewer 2 ----
  review-nvidia:
    name: Review — nvidia/nemotron-3-ultra
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Guard against Claude models on OpenRouter
        run: |
          if [ "${{ contains(env.config__model, 'claude') }}" = "true" ] || \
             [ "${{ contains(env.config__fallback_models, 'claude') }}" = "true" ]; then
            echo "::error::Repo policy forbids Claude models on OpenRouter."
            exit 1
          fi

      - name: PR-Agent /review (OpenRouter)
        uses: the-pr-agent/pr-agent@v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          github_action_config__auto_review: "true"
          github_action_config__auto_describe: "false"
          github_action_config__auto_improve: "false"

          # Re-run review on every commit pushed to the PR (synchronize),
          # not just on open/reopen/ready_for_review. Without this, PR-Agent's
          # runner skips the auto tools on follow-up pushes because its
          # default pr_actions list omits "synchronize".
          github_action_config__pr_actions: '["opened", "synchronize", "reopened", "ready_for_review", "review_requested"]'

          config__model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
          config__fallback_models: '["openrouter/nex-agi/nex-n2-pro:free"]'
          config__custom_model_max_tokens: "8000"

          pr_reviewer__require_focused_review: "true"
          pr_reviewer__num_required_app_review_comments: "1"
          pr_reviewer__exclude_globs: '["**/*.md","**/docs/**","**/coverage/**","**/dist/**"]'

          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # ---- Ollama Cloud reviewer 1 ----
  review-minimax:
    name: Review — minimax-m3:cloud
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: PR-Agent /review (Ollama Cloud)
        uses: the-pr-agent/pr-agent@v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          github_action_config__auto_review: "true"
          github_action_config__auto_describe: "false"
          github_action_config__auto_improve: "false"

          # Re-run review on every commit pushed to the PR (synchronize),
          # not just on open/reopen/ready_for_review. Without this, PR-Agent's
          # runner skips the auto tools on follow-up pushes because its
          # default pr_actions list omits "synchronize".
          github_action_config__pr_actions: '["opened", "synchronize", "reopened", "ready_for_review", "review_requested"]'

          config__model: "openai/minimax-m3:cloud"
          config__fallback_models: '["openai/kimi-k2.7-code:cloud"]'
          config__custom_model_max_tokens: "8000"

          pr_reviewer__require_focused_review: "true"
          pr_reviewer__num_required_app_review_comments: "1"
          pr_reviewer__exclude_globs: '["**/*.md","**/docs/**","**/coverage/**","**/dist/**"]'

          # Ollama Cloud via its OpenAI-compatible endpoint.
          # OPENAI__KEY carries the Ollama Cloud key so LiteLLM sends the
          # Authorization: Bearer header.
          OPENAI__KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI__BASE: "https://ollama.com/v1"
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_BASE_URL: "https://ollama.com/v1"

  # ---- Ollama Cloud reviewer 2 ----
  review-kimi:
    name: Review — kimi-k2.7-code:cloud
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: PR-Agent /review (Ollama Cloud)
        uses: the-pr-agent/pr-agent@v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          github_action_config__auto_review: "true"
          github_action_config__auto_describe: "false"
          github_action_config__auto_improve: "false"

          # Re-run review on every commit pushed to the PR (synchronize),
          # not just on open/reopen/ready_for_review. Without this, PR-Agent's
          # runner skips the auto tools on follow-up pushes because its
          # default pr_actions list omits "synchronize".
          github_action_config__pr_actions: '["opened", "synchronize", "reopened", "ready_for_review", "review_requested"]'

          config__model: "openai/kimi-k2.7-code:cloud"
          config__fallback_models: '["openai/deepseek-v4-flash:cloud"]'
          config__custom_model_max_tokens: "8000"

          pr_reviewer__require_focused_review: "true"
          pr_reviewer__num_required_app_review_comments: "1"
          pr_reviewer__exclude_globs: '["**/*.md","**/docs/**","**/coverage/**","**/dist/**"]'

          OPENAI__KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI__BASE: "https://ollama.com/v1"
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_BASE_URL: "https://ollama.com/v1"

  # ---- Ollama Cloud reviewer 3 ----
  review-deepseek:
    name: Review — deepseek-v4-flash:cloud
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: PR-Agent /review (Ollama Cloud)
        uses: the-pr-agent/pr-agent@v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          github_action_config__auto_review: "true"
          github_action_config__auto_describe: "false"
          github_action_config__auto_improve: "false"

          # Re-run review on every commit pushed to the PR (synchronize),
          # not just on open/reopen/ready_for_review. Without this, PR-Agent's
          # runner skips the auto tools on follow-up pushes because its
          # default pr_actions list omits "synchronize".
          github_action_config__pr_actions: '["opened", "synchronize", "reopened", "ready_for_review", "review_requested"]'

          config__model: "openai/deepseek-v4-flash:cloud"
          config__fallback_models: '["openai/minimax-m3:cloud"]'
          config__custom_model_max_tokens: "8000"

          pr_reviewer__require_focused_review: "true"
          pr_reviewer__num_required_app_review_comments: "1"
          pr_reviewer__exclude_globs: '["**/*.md","**/docs/**","**/coverage/**","**/dist/**"]'

          OPENAI__KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI__BASE: "https://ollama.com/v1"
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_BASE_URL: "https://ollama.com/v1"
