version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arbitrage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-arbitrage}
      POSTGRES_USER: ${DB_USER:-arbitrage_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arbitrage_user} -d ${DB_NAME:-arbitrage}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - arbitrage-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-api
    restart: unless-stopped
    command: npm run start:prod:api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-arbitrage_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-arbitrage}
      - SENTRY_DSN=${SENTRY_DSN}
      - API_PORT=${API_PORT:-3000}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"  # Only accessible from localhost (Nginx will proxy)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - arbitrage-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-worker
    restart: unless-stopped
    command: npm run start:prod:worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-arbitrage_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-arbitrage}
      - SENTRY_DSN=${SENTRY_DSN}
      - WORKER_SCAN_INTERVAL_MINUTES=${WORKER_SCAN_INTERVAL_MINUTES:-15}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - arbitrage-network

volumes:
  postgres_data:
    driver: local

networks:
  arbitrage-network:
    driver: bridge
