version: '3.8'

# Memory budget for 8 GB VPS (2 vCPU, 100 GB NVMe):
#   postgres: 1536M  — shared buffers + working set
#   api:      1536M  — NestJS + read-model queries
#   worker:   3G     — scan loop, market fetch, LLM inference
#   OS/Docker overhead: ~2G headroom

services:
  postgres:
    image: postgres:16-alpine
    container_name: arbitrage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-arbitrage}
      POSTGRES_USER: ${DB_USER:-arbitrage_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arbitrage_user} -d ${DB_NAME:-arbitrage}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - arbitrage-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-api
    # Run as host UID/GID 1000 (ubuntu) so any host-visible files written by
    # the container are owned by the host user (no EACCES on host-side gates).
    user: "1000:1000"
    restart: unless-stopped
    command: npm run start:prod:api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-arbitrage_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-arbitrage}
      - PORT=${API_PORT:-3000}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_SEND_DEFAULT_PII=${SENTRY_SEND_DEFAULT_PII:-false}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - LLM_PROMPT_SAMPLE_RATE=${LLM_PROMPT_SAMPLE_RATE:-0}
      - SENTRY_MONITOR_SLUG=${SENTRY_MONITOR_SLUG:-arbitrage-agents-scan}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/api/chat}
      - LLM_MODEL=${LLM_MODEL:-glm-5.2:cloud}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_REQUEST_TIMEOUT_MS=${LLM_REQUEST_TIMEOUT_MS:-30000}
      - SCANNER_LLM_PROMPT_VERSION=${SCANNER_LLM_PROMPT_VERSION:-scanner-v1}
      - SCANNER_LLM_MAX_EVALUATIONS_PER_SCAN=${SCANNER_LLM_MAX_EVALUATIONS_PER_SCAN:-25}
      # Legacy vars (not read by app, kept for backward compat)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"  # Only accessible from localhost (Nginx will proxy)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    networks:
      - arbitrage-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-worker
    # Run as host UID/GID 1000 (ubuntu); see api service for rationale.
    user: "1000:1000"
    restart: unless-stopped
    command: npm run start:prod:worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-arbitrage_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-arbitrage}
      - WORKER_SCAN_INTERVAL_MINUTES=${WORKER_SCAN_INTERVAL_MINUTES:-15}
      - WORKER_SHUTDOWN_TIMEOUT_MS=${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_SEND_DEFAULT_PII=${SENTRY_SEND_DEFAULT_PII:-false}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - LLM_PROMPT_SAMPLE_RATE=${LLM_PROMPT_SAMPLE_RATE:-0}
      - SENTRY_MONITOR_SLUG=${SENTRY_MONITOR_SLUG:-arbitrage-agents-scan}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/api/chat}
      - LLM_MODEL=${LLM_MODEL:-glm-5.2:cloud}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_REQUEST_TIMEOUT_MS=${LLM_REQUEST_TIMEOUT_MS:-30000}
      - SCANNER_LLM_PROMPT_VERSION=${SCANNER_LLM_PROMPT_VERSION:-scanner-v1}
      - SCANNER_LLM_MAX_EVALUATIONS_PER_SCAN=${SCANNER_LLM_MAX_EVALUATIONS_PER_SCAN:-25}
      # Legacy vars (not read by app, kept for backward compat)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    # P0 fix: the shared Dockerfile image defines a healthcheck that probes
    # localhost:3000/health, which only the API serves. The worker is a
    # background loop, not an HTTP service, so that probe fails and the
    # container is marked (unhealthy) despite scans succeeding. Disable the
    # inherited healthcheck for the worker service; rely on scan metrics and
    # Sentry check-ins for liveness instead.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M
    networks:
      - arbitrage-network

  pmxt-shadow:
    profiles: ["pmxt-shadow"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-pmxt-shadow
    user: "1000:1000"
    restart: "no"
    command: npm run start:prod:pmxt-shadow
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-arbitrage_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-arbitrage}
      - KALSHI_SERIES_TICKER=${KALSHI_SERIES_TICKER:-KXBTCD}
      - POLYMARKET_SERIES_SLUG=${POLYMARKET_SERIES_SLUG:-btc-multi-strikes-weekly}
      - PMXT_API_KEY=${PMXT_API_KEY}
      - PMXT_HOSTED_BASE_URL=${PMXT_HOSTED_BASE_URL}
      - PMXT_SHADOW_ENABLED=${PMXT_SHADOW_ENABLED:-false}
      - PMXT_SHADOW_READS_ENABLED=${PMXT_SHADOW_READS_ENABLED:-false}
      - PMXT_SHADOW_ROUTER_ENABLED=${PMXT_SHADOW_ROUTER_ENABLED:-false}
      - PMXT_SHADOW_SAMPLE_RATE=${PMXT_SHADOW_SAMPLE_RATE:-0/1}
      - PMXT_SHADOW_MAX_QUEUE_DEPTH=${PMXT_SHADOW_MAX_QUEUE_DEPTH}
      - PMXT_SHADOW_MAX_QUEUE_WAIT_MS=${PMXT_SHADOW_MAX_QUEUE_WAIT_MS}
      - PMXT_SHADOW_MAX_REQUESTS_PER_RUN=${PMXT_SHADOW_MAX_REQUESTS_PER_RUN}
      - PMXT_SHADOW_MAX_MONTHLY_CREDITS=${PMXT_SHADOW_MAX_MONTHLY_CREDITS}
      - PMXT_SHADOW_MAX_MONTHLY_COST_USD=${PMXT_SHADOW_MAX_MONTHLY_COST_USD}
      - PMXT_SHADOW_TIMEOUT_MS=${PMXT_SHADOW_TIMEOUT_MS:-60000}
      - PMXT_REQUEST_TIMEOUT_MS=${PMXT_REQUEST_TIMEOUT_MS:-10000}
      - PMXT_SHADOW_REQUESTS_PER_MINUTE=${PMXT_SHADOW_REQUESTS_PER_MINUTE:-60}
      - PMXT_SHADOW_MAX_CONCURRENCY=${PMXT_SHADOW_MAX_CONCURRENCY:-1}
      - PMXT_SHADOW_MAX_MARKETS_PER_VENUE=${PMXT_SHADOW_MAX_MARKETS_PER_VENUE}
      - PMXT_SHADOW_MAX_BOOKS_PER_VENUE=${PMXT_SHADOW_MAX_BOOKS_PER_VENUE}
      - PMXT_SHADOW_RAW_RETENTION_DAYS=${PMXT_SHADOW_RAW_RETENTION_DAYS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - arbitrage-network

volumes:
  postgres_data:
    driver: local

networks:
  arbitrage-network:
    driver: bridge
